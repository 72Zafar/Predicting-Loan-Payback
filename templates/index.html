<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Payback Prediction</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">Loan Payback Prediction</h1>
            <p class="subtitle">Machine Learning Model for Predicting Loan Repayment</p>
        </header>

        <main class="main-content">
            <form id="predictionForm" class="form" method="POST" action="/">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="Annual_income" class="label">Annual Income</label>
                        <input type="number" id="Annual_income" name="Annual_income" class="input" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="Debet_to_income_ratio" class="label">Debt to Income Ratio</label>
                        <input type="number" id="Debet_to_income_ratio" name="Debet_to_income_ratio" class="input" step="0.01">
                    </div>

                    <div class="form-group">
                        <label for="Credit_score" class="label">Credit Score</label>
                        <input type="number" id="Credit_score" name="Credit_score" class="input" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="Loan_amount" class="label">Loan Amount</label>
                        <input type="number" id="Loan_amount" name="Loan_amount" class="input" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="Interest_rate" class="label">Interest Rate</label>
                        <input type="number" id="Interest_rate" name="Interest_rate" class="input" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="Gender" class="label">Gender</label>
                        <input type="text" id="Gender" name="Gender" class="input" required placeholder="e.g. Male, Female">
                    </div>

                    <div class="form-group">
                        <label for="Marital_status" class="label">Marital Status</label>
                        <select id="Marital_status" name="Marital_status" class="input" required>
                            <option value="">Select</option>
                            <option value="Single">Single</option>
                            <option value="Married">Married</option>
                            <option value="Divorced">Divorced</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="Loan_prupose" class="label">Loan Purpose</label>
                        <select id="Loan_prupose" name="Loan_prupose" class="input" required>
                            <option value="">Select</option>
                            <option value="Other">Other</option>
                            <option value="Debt consolidation">Debt consolidation</option>
                            <option value="Car">Car</option>
                            <option value="Education">Education</option>
                            <option value="Home">Home</option>
                            <option value="Medical">Medical</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="Income_to_loan_ratio" class="label">Income to Loan Ratio</label>
                        <input type="number" id="Income_to_loan_ratio" name="Income_to_loan_ratio" class="input" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="Affordability" class="label">Affordability</label>
                        <input type="number" id="Affordability" name="Affordability" class="input" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="Rist_score" class="label">Risk Score</label>
                        <input type="number" id="Rist_score" name="Rist_score" class="input" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="Grate" class="label">Grade</label>
                        <select id="Grate" name="Grate" class="input" required>
                            <option value="">Select</option>
                            <option value="A">A</option>
                            <option value="B">B</option>
                            <option value="C">C</option>
                            <option value="D">D</option>
                            <option value="E">E</option>
                            <option value="F">F</option>
                            <option value="G">G</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="Subgrade_num" class="label">Subgrade Number</label>
                        <input type="number" id="Subgrade_num" name="Subgrade_num" class="input" min="1" max="5" required>
                    </div>

                    <div class="form-group">
                        <label for="Employment_stability" class="label">Employment Status</label>
                        <select id="Employment_stability" name="Employment_stability" class="input" required>
                            <option value="">Select</option>
                            <option value="0">Unemployed</option>
                            <option value="1">Student</option>
                            <option value="2">Self-employed</option>
                            <option value="3">Employed</option>
                            <option value="2">Retired</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="Education_num" class="label">Education Level</label>
                        <select id="Education_num" name="Education_num" class="input" required>
                            <option value="">Select</option>
                            <option value="1">High School</option>
                            <option value="2">Other</option>
                            <option value="3">Bachelor's</option>
                            <option value="4">Master's</option>
                            <option value="5">PhD</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Predict Loan Payback</button>
                    <button type="reset" class="btn btn-secondary">Reset Form</button>
                </div>
            </form>

            <div id="result" class="result-container" style="display: none;">
                <div class="result-card">
                    <h2 class="result-title">Prediction Result</h2>
                    <div id="resultContent" class="result-content"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const form = e.target;
            const formData = new FormData(form);
            const resultContainer = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');
            
            // Show loading state
            resultContainer.style.display = 'block';
            resultContent.innerHTML = '<div class="loading">Processing prediction...</div>';
            
            try {
                const response = await fetch('/', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.status !== null && data.status !== undefined) {
                    const statusClass = data.status ? 'success' : 'error';
                    const statusIcon = data.status ? '✓' : '✗';
                    resultContent.innerHTML = `
                        <div class="result-status ${statusClass}">
                            <span class="status-icon">${statusIcon}</span>
                            <div class="status-content">
                                <h3 class="status-title">${data.prediction || 'Prediction'}</h3>
                                <p class="status-message">${data.message || ''}</p>
                            </div>
                        </div>
                    `;
                } else {
                    resultContent.innerHTML = `
                        <div class="result-status error">
                            <span class="status-icon">⚠</span>
                            <div class="status-content">
                                <h3 class="status-title">Error</h3>
                                <p class="status-message">${data.message || 'An error occurred during prediction.'}</p>
                            </div>
                        </div>
                    `;
                }
            } catch (error) {
                resultContent.innerHTML = `
                    <div class="result-status error">
                        <span class="status-icon">⚠</span>
                        <div class="status-content">
                            <h3 class="status-title">Error</h3>
                            <p class="status-message">${error.message || 'Failed to connect to the server.'}</p>
                        </div>
                    </div>
                `;
            }
            
            // Scroll to result
            resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        });
    </script>
</body>
</html>
